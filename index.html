<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedido de Pizza</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .formulario {
            background-color: white;
            max-width: 600px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #d66b16;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 18px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="checkbox"],
        input[type="radio"] {
            width: auto;
        }

        .opcion {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        .precio {
            color: #d66b16;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background-color: #e98220;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c96a12;
        }

        #resultado {
            text-align: center;
            color: green;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="formulario">

    <h1>🍕 Pedido de Pizza</h1>

    <form id="pedido">

        <label>Nombre del cliente:</label>
        <input type="text" id="nombre" required>

        <label>Tamaño de la pizza:</label>
        <select id="tamano" required>
            <option value="">Selecciona un tamaño</option>
            <option value="8000">Chica - $8.000</option>
            <option value="12000">Mediana - $12.000</option>
            <option value="16000">Grande - $16.000</option>
            <option value="20000">Familiar - $20.000</option>
        </select>

        <label>Ingredientes adicionales:</label>

        <div class="opcion">
            <span><input type="checkbox" value="1500" class="extra"> Jamón</span>
            <span class="precio">+$1.500</span>
        </div>

        <div class="opcion">
            <span><input type="checkbox" value="800" class="extra"> Aceitunas</span>
            <span class="precio">+$800</span>
        </div>

        <div class="opcion">
            <span><input type="checkbox" value="1200" class="extra"> Champiñones</span>
            <span class="precio">+$1.200</span>
        </div>

        <div class="opcion">
            <span><input type="checkbox" value="1000" class="extra"> Extra de queso</span>
            <span class="precio">+$1.000</span>
        </div>

        <label>Tipo de masa:</label>

        <div class="opcion">
            <span><input type="radio" name="masa" value="0" required> Fina</span>
            <span class="precio">Sin cargo</span>
        </div>

        <div class="opcion">
            <span><input type="radio" name="masa" value="0"> Tradicional</span>
            <span class="precio">Sin cargo</span>
        </div>

        <div class="opcion">
            <span><input type="radio" name="masa" value="2000"> Rellena de queso</span>
            <span class="precio">+$2.000</span>
        </div>

        <label>Comentarios del pedido:</label>
        <textarea id="comentarios" rows="4"
        placeholder="Ej.: sin cebolla, bien cocida..."></textarea>

        <button type="submit">Realizar pedido</button>

    </form>

    <div id="resultado"></div>

</div>

<script>

    document.getElementById("pedido").addEventListener("submit", function(event) {

        event.preventDefault();

        let nombre = document.getElementById("nombre").value;
        let total = Number(document.getElementById("tamano").value);

        // Sumar ingredientes adicionales
        let extras = document.querySelectorAll(".extra:checked");

        extras.forEach(function(ingrediente) {
            total += Number(ingrediente.value);
        });

        // Sumar el tipo de masa
        let masa = document.querySelector('input[name="masa"]:checked');

        total += Number(masa.value);

        // Mostrar el precio final
        document.getElementById("resultado").innerHTML =
            "¡Gracias, " + nombre + "!<br>" +
            "El precio final es: $" + total.toLocaleString("es-AR");

    });

</script>

</body>
</html
